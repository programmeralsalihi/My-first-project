<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عبيده عامر للبرامج - الصفحة الرئيسية</title>
    <!-- Tailwind CSS للمظهر العصري المتجاوب -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; margin: 0; padding: 0; background-color: #0f172a; color: #f1f5f9; }
        
        /* تأثير الظهور عند التمرير */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* تأثير التوهج للبطاقات (Glow Effect) */
        .glow-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: #1e293b;
        }
        .glow-card:hover {
            transform: translateY(-8px);
            border-color: rgba(249, 115, 22, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(249, 115, 22, 0.1);
        }

        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; } /* slate-900 */
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; } /* indigo-600 */
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; } /* indigo-500 */
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Amazon-like Header -->
    <header class="bg-gray-900 text-white p-3 sticky top-0 z-50 shadow-md">
        <div class="max-w-screen-xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 md:gap-4">
            <!-- Logo and Mobile Store Button (Row 1 on Mobile) -->
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center gap-2">
                    <a href="index.htm" class="text-xl font-black text-orange-400">متجر عبيده عامر</a>
                    <span class="text-xs text-gray-400">للبرامج</span>
                </div>
                <!-- Store Button: Visible on Mobile only -->
                <div class="md:hidden">
                    <button onclick="window.location.reload()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-md text-xs font-bold transition">
                        <i class="fa-solid fa-store ml-1"></i> المتجر
                    </button>
                </div>
            </div>

            <!-- Search Bar (Row 2 on Mobile) -->
            <div class="w-full md:flex-grow md:max-w-2xl md:mx-4">
                <div class="relative flex items-center">
                    <input type="text" id="search-input" onkeyup="searchApps()" placeholder="ابحث عن برامج، أدوات، والمزيد..." class="w-full bg-white text-gray-900 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 text-sm pl-10">
                    <button class="absolute left-0 top-0 h-full px-3 flex items-center justify-center text-gray-600 hover:text-orange-500 transition">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <!-- Store Button (Visible on Desktop only) -->
            <div class="hidden md:flex items-center">
                <button onclick="window.location.reload()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-md text-xs font-bold transition">
                    <i class="fa-solid fa-store ml-1"></i> المتجر
                </button>
            </div>
        </div>
    </header>

    <!-- Main Navigation (below header) -->
    <nav class="bg-gray-800 text-white p-2 shadow-sm">
        <div class="max-w-screen-xl mx-auto flex items-center gap-8 text-sm font-bold">
            <button onclick="renderStoreApps(appsDatabase)" class="hover:text-orange-400 transition cursor-pointer">الكل</button>
            <button onclick="filterNewApps()" class="hover:text-orange-400 transition cursor-pointer">برامج جديدة (آخر 5 أيام)</button>
        </div>
    </nav>

    <main class="flex-1 bg-slate-900">
        <!-- Hero/Banner Section -->
        <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white py-16 px-4 text-center reveal">
            <div class="max-w-screen-xl mx-auto">
                <h2 class="text-4xl md:text-5xl font-extrabold mb-4">اكتشف عالم البرامج الاحترافية</h2>
                <p class="text-lg md:text-xl text-blue-200 mb-8">كل ماتحتاجه من برامج بعد الفورمات في مكان واحد</p>
                <a href="#product-grid-section" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full text-lg transition duration-300 shadow-lg">
                    تصفح البرامج الآن <i class="fa-solid fa-arrow-left mr-2"></i>
                </a>
            </div>
        </section>

        <div class="max-w-screen-xl mx-auto px-4 py-8 md:py-12 space-y-12">
            
            <!-- All Products Grid -->
            <section id="product-grid-section" class="space-y-6 reveal">
                <h3 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-th-large text-blue-600"></i> جميع البرامج
                </h3>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- يتم توليد كروت البرامج تلقائياً -->
                </div>
            </section>

        </div>
    </main>

    <!-- Amazon-like Footer -->
    <footer class="bg-gray-900 text-gray-300 py-10">
        <div class="max-w-screen-xl mx-auto px-4">
            <div class="flex flex-col md:grid md:grid-cols-2 gap-8 mb-8 border-b border-gray-700 pb-8 text-right">
                <div>
                    <h4 class="text-lg font-bold text-white mb-4 italic">تعرف علينا</h4>
                    <ul class="space-y-2 text-sm">
                        <li class="text-gray-400 font-bold leading-relaxed">نوفر جميع البرامج بشكل موثوق ومن مصادر موثوقة ورسمية.</li>
                    </ul>
                </div>
                <div>
                    <h4 class="text-lg font-bold text-white mb-4">تواصل معنا</h4>
                    <div class="flex items-center gap-6 text-sm">
                        <a href="#" class="hover:text-orange-400 transition flex items-center"><i class="fa-brands fa-facebook ml-2"></i> فيسبوك</a>
                        <a href="#" class="hover:text-orange-400 transition flex items-center"><i class="fa-brands fa-telegram ml-2"></i> تيليجرام</a>
                    </div>
                </div>
            </div>
            <div class="text-center text-sm text-gray-500">
                &copy; 2026 متجر عبيده عامر للبرامج. جميع الحقوق محفوظة.
            </div>
        </div>
    </footer>

    <!-- ربط محرك التحكم البرمجي التفاعلي خالي الأخطاء -->
    <script src="index.js"></script>
</body>
</html>
